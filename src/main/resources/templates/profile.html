<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ người dùng - CineTicket</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/icon.svg}">
    <link rel="alternate icon" type="image/png" th:href="@{/icon.png}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

    <main class="container page-section">
        <section class="profile-page">
            <p class="eyebrow text-success mb-2">TÀI KHOẢN</p>
            <h1 class="h2 mb-2">Hồ sơ người dùng</h1>
            <p class="text-secondary mb-4">Thông tin tài khoản CineTicket của bạn.</p>

            <div class="profile-card">
                <div class="profile-card-header">
                    <div class="profile-avatar" aria-hidden="true">
                        <svg viewBox="0 0 48 48" fill="none">
                            <circle cx="24" cy="24" r="21" />
                            <circle class="profile-avatar-head" cx="24" cy="17" r="6" />
                            <path d="M10.5 38c2.2-6.2 7-9.5 13.5-9.5s11.3 3.3 13.5 9.5" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="h4 mb-1" th:text="${profile.fullName}">Tên người dùng</h2>
                        <span class="profile-role" th:text="${profile.role}">Khách hàng</span>
                    </div>
                </div>

                <dl class="profile-details mb-0">
                    <div>
                        <dt>Email</dt>
                        <dd th:text="${profile.email}">email@example.com</dd>
                    </div>
                    <div>
                        <dt>Số điện thoại</dt>
                        <dd th:text="${profile.phone}">Chưa cập nhật</dd>
                    </div>
                    <div>
                        <dt>Ngày tạo tài khoản</dt>
                        <dd th:text="${profile.createdAt}">01/01/2025 12:00</dd>
                    </div>
                </dl>

                <div class="profile-actions">
                    <a class="btn btn-outline-success" th:href="@{/profile/change-password}">Đổi mật khẩu</a>
                </div>
            </div>
            <div th:if="${param.passwordChanged}" class="alert alert-success mt-3 mb-0">
                Mật khẩu đã được đổi thành công.
            </div>
        </section>
    </main>
</body>
</html>
