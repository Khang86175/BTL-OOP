<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/catalog :: head('Xác nhận đặt vé')}"></head>
<body class="bg-light">
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
<main class="container page-section">
    <section class="schedule-card mx-auto" style="max-width: 760px;">
        <h1 class="fw-bold mb-4">Xác nhận thông tin vé</h1>
        <p class="mb-2">Vui lòng kiểm tra lại thông tin trước khi thanh toán.</p>
        <h2 class="h5 mt-4">Ghế đã đặt</h2>
        <ul class="mb-4">
            <li th:each="seatName : ${preview.seatNames}" th:text="${seatName}"></li>
        </ul>
        <p class="fs-5">Tổng tiền:
            <strong class="text-success"
                    th:text="${#numbers.formatDecimal(preview.totalAmount,0,'COMMA',2,'POINT') + ' đ'}"></strong>
        </p>
        <div class="d-flex flex-wrap gap-2 mt-4">
            <a class="btn btn-outline-success" th:href="@{/showtimes}">Quay lại lịch chiếu</a>
            <form th:action="@{/bookings/payment}" method="post" class="m-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}">
                <input type="hidden" name="showtimeId" th:value="${preview.showtimeId}">
                <input type="hidden" name="seatIds" th:each="seatId : ${preview.seatIds}" th:value="${seatId}">
                <button type="submit" class="btn btn-success">Thanh toán</button>
            </form>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/catalog :: footer}"></th:block>
</body>
</html>
