<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/catalog :: head('Thanh toán vé')}"></head>
<body class="bg-light">
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
<main class="container page-section">
    <section class="schedule-card mx-auto text-center" style="max-width: 760px;">
        <h1 class="fw-bold mb-3">Thanh toán vé</h1>
        <div th:if="${success}" class="alert alert-success text-start" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger text-start" th:text="${error}"></div>
        <p>Mã đặt vé: <strong th:text="${booking.id}"></strong></p>
        <p class="small text-secondary" th:if="${booking.status != null and booking.status.name() == 'PENDING_PAYMENT'}">
            Trạng thái: Đang chờ thanh toán
            <span th:if="${booking.holdExpiresAt != null}">
                · Giữ ghế đến <span th:text="${#temporals.format(booking.holdExpiresAt,'dd/MM/yyyy HH:mm')}"></span>
            </span>
        </p>
        <p class="fs-5">Số tiền cần thanh toán:
            <strong class="text-success" th:text="${#numbers.formatDecimal(booking.totalAmount,0,'COMMA',2,'POINT') + ' đ'}"></strong>
        </p>
        <form th:if="${booking.status != null and booking.status.name() == 'PENDING_PAYMENT'}"
              th:action="@{/bookings/payment/{id}/process(id=${booking.id})}" method="post" class="text-start mt-4">
            <label for="method" class="form-label fw-semibold">Phương thức thanh toán</label>
            <select id="method" name="method" class="form-select" required>
                <option th:each="method : ${paymentMethods}" th:value="${method}"
                        th:text="${method == 'CARD' ? 'Mock Card' : 'Mock Wallet'}"
                        th:selected="${method == selectedMethod}"></option>
            </select>
            <div class="form-text">Thanh toán giả lập cho đồ án; không nhập số thẻ, CVV, mật khẩu ví hoặc OTP.</div>
            <label for="outcome" class="form-label fw-semibold mt-3">Kết quả demo</label>
            <select id="outcome" name="outcome" class="form-select" required>
                <option value="SUCCESS">Thành công</option>
                <option value="FAILED">Thất bại</option>
            </select>
            <button type="submit" class="btn btn-success mt-4">Thanh toán giả lập</button>
            <a class="btn btn-outline-secondary mt-4 ms-2" th:href="@{/bookings/history}">Lịch sử thanh toán</a>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}">
        </form>
        <div th:unless="${booking.status != null and booking.status.name() == 'PENDING_PAYMENT'}"
             class="alert alert-info mt-4">Đơn đặt vé này không còn chờ thanh toán.</div>
    </section>
</main>
<th:block th:replace="~{fragments/catalog :: footer}"></th:block>
</body>
</html>
