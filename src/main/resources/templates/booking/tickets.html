<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/catalog :: head('Vé của tôi')}"></head>
<body class="bg-light">
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
<main class="container page-section">
    <section class="schedule-card mx-auto" style="max-width: 900px;">
        <h1 class="fw-bold mb-4">Vé của tôi</h1>
        <div th:if="${#lists.isEmpty(tickets)}" class="alert alert-info">Chưa có vé được phát hành.</div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(tickets)}">
            <table class="table align-middle">
                <thead><tr><th>Mã vé</th><th>Phim</th><th>Ghế</th><th>Suất chiếu</th></tr></thead>
                <tbody><tr th:each="ticket : ${tickets}">
                    <td class="fw-semibold" th:text="${ticket.code}"></td>
                    <td th:text="${ticket.movie.title}"></td>
                    <td th:text="${ticket.seat.rowLabel + ticket.seat.seatNumber}"></td>
                    <td th:text="${#temporals.format(ticket.showtimeStart,'dd/MM/yyyy HH:mm')}"></td>
                </tr></tbody>
            </table>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/bookings/history}">Quay lại lịch sử</a>
    </section>
</main>
<th:block th:replace="~{fragments/catalog :: footer}"></th:block>
</body>
</html>
