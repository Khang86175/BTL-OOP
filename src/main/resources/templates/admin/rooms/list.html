<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/catalog :: head('Quản lý phòng')}"></head>
<body><th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
<th:block th:replace="~{fragments/schedule :: nav}"></th:block>
<main class="container page-section"><h1 class="fw-bold mb-4">Quản lý phòng</h1>
<th:block th:replace="~{fragments/schedule :: alerts}"></th:block>
<form method="get" class="d-flex gap-2 mb-3"><select name="theaterId" class="form-select"><option value="">Tất cả rạp</option><option th:each="t : ${theaters}" th:value="${t.id}" th:text="${t.name}" th:selected="${t.id == theaterId}"></option></select><button class="btn btn-outline-success">Lọc</button></form>
<a class="btn btn-success mb-4" th:href="@{/admin/rooms/new(theaterId=${theaterId})}">Thêm phòng</a>
<div class="table-responsive panel"><table class="table schedule-table"><thead><tr><th>Rạp</th><th>Phòng</th><th>Loại</th><th>Trạng thái phòng</th><th>Thao tác</th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(rooms)}"><td colspan="5">Chưa có phòng phù hợp.</td></tr>
<tr th:each="x : ${rooms}"><td th:text="${x.theaterName}"></td><td th:text="${x.name}"></td><td th:text="${roomLabels[x.roomType.name()]}"></td><td><span class="badge" th:classappend="${x.active} ? 'bg-success' : 'bg-secondary'" th:text="${x.active} ? 'Hoạt động' : 'Ngừng hoạt động'"></span><small th:if="${x.active and !x.operational}" class="d-block text-danger">Rạp đang ngừng hoạt động</small></td><td><div class="schedule-actions"><a class="btn btn-outline-success btn-sm" th:href="@{/admin/rooms/{id}/edit(id=${x.id})}">Sửa</a><a class="btn btn-outline-success btn-sm" th:href="@{/admin/seats(roomId=${x.id})}">Ghế</a><form method="post" th:action="@{/admin/rooms/{id}/active(id=${x.id})}"><input type="hidden" name="active" th:value="${!x.active}"><button class="btn btn-outline-secondary btn-sm" th:text="${x.active} ? 'Tắt' : 'Bật'"></button></form></div></td></tr></tbody></table></div>
</main><th:block th:replace="~{fragments/catalog :: footer}"></th:block></body></html>
