<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/catalog :: head('Thêm / sửa phòng')}"></head>
<body><th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
<th:block th:replace="~{fragments/schedule :: nav}"></th:block>
<main class="container page-section"><h1 class="fw-bold mb-4">Thêm / sửa phòng</h1>
<th:block th:replace="~{fragments/schedule :: alerts}"></th:block>
<form class="panel p-4 schedule-form" th:object="${form}" th:action="${id == null} ? @{/admin/rooms} : @{/admin/rooms/{id}(id=${id})}" method="post">
<th:block th:replace="~{fragments/schedule :: errors}"></th:block><div class="mb-3"><label class="form-label" for="theaterId">Rạp</label><select class="form-select" th:field="*{theaterId}" required><option value="">Chọn rạp</option><option th:each="x : ${theaters}" th:value="${x.id}" th:text="${x.name}"></option></select></div><p class="small text-secondary">Phòng đã tạo được giữ tại rạp ban đầu.</p><div class="mb-3"><label class="form-label" for="name">Tên phòng</label><input class="form-control" th:field="*{name}" type="text" required maxlength="80"><div class="text-danger small" th:if="${#fields.hasErrors('name')}">Vui lòng kiểm tra tên phòng.</div></div><div class="mb-3"><label class="form-label" for="roomType">Loại phòng</label><select class="form-select" th:field="*{roomType}" required><option value="">Chọn loại phòng</option><option th:each="x : ${roomLabels}" th:value="${x.key}" th:text="${x.value}"></option></select></div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label" th:for="${#ids.prev('active')}">Đang hoạt động</label></div><div class="d-flex gap-2"><button class="btn btn-success" type="submit">Lưu</button><a class="btn btn-outline-secondary" th:href="@{/admin/rooms}">Quay lại</a></div></form>
</main><th:block th:replace="~{fragments/catalog :: footer}"></th:block></body></html>
