<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/catalog :: head('Quản lý rạp')}"></head>
<body><th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
<th:block th:replace="~{fragments/schedule :: nav}"></th:block>
<main class="container page-section"><h1 class="fw-bold mb-4">Quản lý rạp</h1>
<th:block th:replace="~{fragments/schedule :: alerts}"></th:block>
<a class="btn btn-success mb-4" th:href="@{/admin/theaters/new}">Thêm rạp</a>
<div class="table-responsive panel"><table class="table schedule-table"><thead><tr><th>Rạp</th><th>Địa chỉ</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(theaters)}"><td colspan="4">Chưa có rạp. Hãy thêm rạp đầu tiên.</td></tr>
<tr th:each="x : ${theaters}"><td th:text="${x.name}"></td><td th:text="${x.address}"></td><td><span class="badge" th:classappend="${x.active} ? 'bg-success' : 'bg-secondary'" th:text="${x.active} ? 'Hoạt động' : 'Ngừng hoạt động'"></span></td><td><div class="schedule-actions"><a class="btn btn-outline-success btn-sm" th:href="@{/admin/theaters/{id}/edit(id=${x.id})}">Sửa</a><a class="btn btn-outline-success btn-sm" th:href="@{/admin/rooms(theaterId=${x.id})}">Phòng</a><form method="post" th:action="@{/admin/theaters/{id}/active(id=${x.id})}"><input type="hidden" name="active" th:value="${!x.active}"><button class="btn btn-outline-secondary btn-sm" th:text="${x.active} ? 'Tắt' : 'Bật'"></button></form></div></td></tr></tbody></table></div>
</main><th:block th:replace="~{fragments/catalog :: footer}"></th:block></body></html>
