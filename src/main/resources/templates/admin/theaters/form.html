<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/catalog :: head('Thêm / sửa rạp')}"></head>
<body><th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
<th:block th:replace="~{fragments/schedule :: nav}"></th:block>
<main class="container page-section"><h1 class="fw-bold mb-4">Thêm / sửa rạp</h1>
<th:block th:replace="~{fragments/schedule :: alerts}"></th:block>
<form class="panel p-4 schedule-form" th:object="${form}" th:action="${id == null} ? @{/admin/theaters} : @{/admin/theaters/{id}(id=${id})}" method="post">
<th:block th:replace="~{fragments/schedule :: errors}"></th:block><div class="mb-3"><label class="form-label" for="name">Tên rạp</label><input class="form-control" th:field="*{name}" type="text" required maxlength="150"><div class="text-danger small" th:if="${#fields.hasErrors('name')}">Vui lòng kiểm tra tên rạp.</div></div><div class="mb-3"><label class="form-label" for="address">Địa chỉ</label><input class="form-control" th:field="*{address}" type="text" required maxlength="500"><div class="text-danger small" th:if="${#fields.hasErrors('address')}">Vui lòng kiểm tra địa chỉ.</div></div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label" th:for="${#ids.prev('active')}">Đang hoạt động</label></div><div class="d-flex gap-2"><button class="btn btn-success" type="submit">Lưu</button><a class="btn btn-outline-secondary" th:href="@{/admin/theaters}">Quay lại</a></div></form>
</main><th:block th:replace="~{fragments/catalog :: footer}"></th:block></body></html>
