<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/catalog :: head('Thêm / sửa lịch chiếu')}"></head>
<body><th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
<th:block th:replace="~{fragments/schedule :: nav}"></th:block>
<main class="container page-section"><h1 class="fw-bold mb-4">Thêm / sửa lịch chiếu</h1>
 <th:block th:replace="~{fragments/schedule :: alerts}"></th:block>
 <p>Giờ kết thúc tính từ thời lượng phim, theo giờ Việt Nam. Hai giá được đặt riêng cho suất chiếu; không tự cộng phụ phí VIP.</p>
 <form id="showtime-form" class="panel p-4 schedule-form" th:object="${form}" th:action="${id == null} ? @{/admin/showtimes} : @{/admin/showtimes/{id}(id=${id})}" method="post">
  <th:block th:replace="~{fragments/schedule :: errors}"></th:block>
  <div class="mb-3"><label class="form-label" for="movieId">Phim</label><select class="form-select" th:field="*{movieId}" required><option value="">Chọn phim</option><option th:each="x : ${movies}" th:value="${x.id}" th:text="${x.title + (x.visible ? '' : ' (đã ẩn)')}"></option></select></div>
  <div class="mb-3"><label class="form-label" for="roomId">Phòng</label><select class="form-select" th:field="*{roomId}" required><option value="">Chọn phòng</option><option th:each="x : ${rooms}" th:value="${x.id}" th:text="${x.theaterName + ' / ' + x.name + (x.operational ? '' : ' (ngừng hoạt động)')}"></option></select></div>
  <div class="mb-3"><label class="form-label" for="startTime">Giờ bắt đầu</label><input class="form-control" th:field="*{startTime}" type="datetime-local" required step="60"><div class="text-danger small" th:if="${#fields.hasErrors('startTime')}">Vui lòng kiểm tra giờ bắt đầu.</div></div>
  <div class="row g-3 mb-3">
   <div class="col-md-6"><label class="form-label" for="normalPrice">Giá vé thường (VNĐ)</label><input class="form-control" th:field="*{normalPrice}" type="number" required min="0.01" max="9999999999.99" step="0.01"><div class="text-danger small" th:if="${#fields.hasErrors('normalPrice')}">Nhập giá vé thường lớn hơn 0, tối đa 2 chữ số thập phân.</div></div>
   <div class="col-md-6"><label class="form-label" for="vipPrice">Giá vé VIP (VNĐ)</label><input class="form-control" th:field="*{vipPrice}" type="number" required min="0.01" max="9999999999.99" step="0.01"><div class="text-danger small" th:if="${#fields.hasErrors('vipPrice')}">Nhập giá vé VIP lớn hơn 0, tối đa 2 chữ số thập phân.</div></div>
  </div>
  <div class="mb-3"><label class="form-label" for="status">Trạng thái</label><select class="form-select" th:field="*{status}" required><option value="">Chọn trạng thái</option><option th:each="x : ${statusLabels}" th:value="${x.key}" th:text="${x.value}"></option></select></div>
  <div class="d-flex gap-2"><button class="btn btn-success" type="submit">Lưu</button><a class="btn btn-outline-secondary" th:href="@{/admin/showtimes}">Quay lại</a></div>
 </form>
</main><th:block th:replace="~{fragments/catalog :: footer}"></th:block></body></html>
