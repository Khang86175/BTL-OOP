<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đổi mật khẩu - CineTicket</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/icon.svg}">
    <link rel="alternate icon" type="image/png" th:href="@{/icon.png}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

    <main class="container page-section">
        <section class="password-page">
            <p class="eyebrow text-success mb-2">BẢO MẬT</p>
            <h1 class="h2 mb-2">Đổi mật khẩu</h1>
            <p class="text-secondary mb-4">Nhập mật khẩu hiện tại, sau đó đặt mật khẩu mới cho tài khoản.</p>

            <div class="profile-card">
                <form th:action="@{/profile/change-password}" th:object="${changePasswordDto}" method="post">
                    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>

                    <div class="mb-3">
                        <label for="currentPassword" class="form-label">Mật khẩu hiện tại</label>
                        <input id="currentPassword" type="password" th:field="*{currentPassword}"
                               class="form-control" autocomplete="current-password" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('currentPassword')}"
                             th:errors="*{currentPassword}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="newPassword" class="form-label">Mật khẩu mới</label>
                        <input id="newPassword" type="password" th:field="*{newPassword}"
                               class="form-control" autocomplete="new-password" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('newPassword')}"
                             th:errors="*{newPassword}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
                        <input id="confirmPassword" type="password" th:field="*{confirmPassword}"
                               class="form-control" autocomplete="new-password" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}"
                             th:errors="*{confirmPassword}"></div>
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-success">Cập nhật mật khẩu</button>
                        <a class="btn btn-outline-secondary" th:href="@{/profile}">Quay lại hồ sơ</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
